name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest, ruff, black, mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install dependencies
        run: pip install -r requirements_test.txt

      - name: Lint
        run: ruff check custom_components tests

      - name: Format
        run: black --check custom_components tests

      - name: Types
        run: mypy custom_components

      - name: Test
        run: pytest tests -q

  card:
    name: typecheck, vitest, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Types
        run: npm run typecheck
        working-directory: frontend

      - name: Test
        run: npm test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      # The bundle is committed, because Home Assistant serves it straight
      # from the integration. A source change without a rebuild would ship a
      # card older than the code it was written for, and nothing else would
      # notice.
      - name: The committed bundle matches the source
        run: git diff --exit-code -- custom_components/preset_manager/www
