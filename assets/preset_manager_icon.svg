<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" color="#F97316">
  <!-- Simplified variant for the brand PNGs, tuned to read on light and dark backgrounds. Drops the dashed selection ring
       and the dashed connectors: below ~128px both collapse into grey mush. -->
  <defs>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- content bounds are 104..976 vertically; shift to centre on the 1024 canvas -->
  <g transform="translate(0,-28)">

  <rect x="96" y="112" width="832" height="680" rx="88"
        fill="currentColor" fill-opacity="0.14"
        stroke="currentColor" stroke-opacity="0.48" stroke-width="16"/>

  <rect x="192" y="208" width="640" height="128" rx="64"
        fill="currentColor" opacity="0.3" filter="url(#softBlur)"/>
  <rect x="192" y="208" width="640" height="128" rx="64" fill="currentColor"/>

  <rect x="192" y="432" width="296" height="264" rx="56" fill="currentColor" fill-opacity="0.60"/>
  <rect x="536" y="432" width="296" height="264" rx="56" fill="currentColor" fill-opacity="0.60"/>

  <line x1="340" y1="856" x2="340" y2="672" stroke="currentColor" stroke-opacity="0.66"
        stroke-width="18" stroke-linecap="round"/>
  <line x1="684" y1="856" x2="684" y2="672" stroke="currentColor" stroke-opacity="0.66"
        stroke-width="18" stroke-linecap="round"/>
  <rect x="288" y="848" width="448" height="128" rx="64" fill="currentColor" fill-opacity="0.78"/>
  </g>
</svg>
